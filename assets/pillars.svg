    <path d="M12 3l9 5-9 5-9-5z"/>
    <path d="M3 13l9 5 9-5"/>
  </g>
  <text x="155" y="160" text-anchor="middle" font-size="23" font-weight="700" fill="#FFFFFF">FULL-STACK</text>
  <text x="155" y="192" text-anchor="middle" font-size="14.5" fill="#E6EDF3">React · Node · TypeScript</text>
  <rect x="130" y="212" width="50" height="4" rx="2" fill="#4285F4"/>

