  </rect>
  <circle cx="155" cy="78" r="42" fill="#172B45" stroke="#4285F4" stroke-opacity=".6"/>
  <circle cx="155" cy="78" r="42" fill="none" stroke="#4285F4" stroke-width="2">
    <animate attributeName="r" values="42;62" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(126.2 49.2) scale(2.4)" fill="none"
