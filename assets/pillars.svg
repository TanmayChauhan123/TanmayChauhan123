<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Core competencies: full-stack development, AI engineering, problem solving, and real-time systems">
  <defs>
    <linearGradient id="google" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#EA4335"/>
      <stop offset="66%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;
    }
  </style>

  <rect width="1200" height="250" fill="#0D1117"/>

  <!-- CARD 1: FULL-STACK -->
  <rect x="20" y="10" width="270" height="230" rx="16"
        fill="#111820" stroke="#30363D" stroke-width="1.5"/>
  <rect x="20" y="10" width="270" height="230" rx="16"
        fill="none" stroke="#4285F4" stroke-width="2.5"
        stroke-dasharray="110 890">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000"
