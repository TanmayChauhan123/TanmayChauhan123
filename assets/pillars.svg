  </rect>
  <circle cx="451.67" cy="78" r="42" fill="#183126" stroke="#34A853" stroke-opacity=".6"/>
  <circle cx="451.67" cy="78" r="42" fill="none" stroke="#34A853" stroke-width="2">
    <animate attributeName="r" values="42;62" dur="2.4s" begin=".5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;0" dur="2.4s" begin=".5s" repeatCount="indefinite"/>
