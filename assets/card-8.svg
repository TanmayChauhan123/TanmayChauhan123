<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 208" width="480" height="208" role="img" aria-label="Credit Card Fraud Detection project card">
  <defs>
    <linearGradient id="google" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#EA4335"/>
      <stop offset="66%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;
    }
  </style>

  <rect width="480" height="208" fill="#0D1117"/>
  <rect x="2" y="2" width="476" height="204" rx="14"
        fill="#111820" stroke="#30363D" stroke-width="2"/>

  <rect x="2" y="2" width="476" height="204" rx="14"
        fill="none" stroke="url(#google)" stroke-width="3"
        stroke-dasharray="150 1226">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-1376" dur="7s"
             begin="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Project icon -->
  <rect x="22" y="20" width="56" height="56" rx="12"
        fill="#172B45" stroke="#4285F4" stroke-width="1.5"/>

  <g transform="translate(26 24) scale(2)"
     fill="none" stroke="#8AB4F8" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>
    <path d="M9 12l2 2 4-4"/>
  </g>

  <text x="94" y="55" font-size="20" font-weight="700" fill="#FFFFFF">Credit Card Fraud Detection</text>
  <text x="458" y="40" text-anchor="end"
        font-size="15" font-weight="700" fill="#FBBC05">08</text>

  <!-- Description -->
  <text x="24" y="104" font-size="14.5" fill="#E6EDF3">
    Machine-learning project exploring credit card
  </text>
  <text x="24" y="126" font-size="14.5" fill="#E6EDF3">
    transaction classification and fraud detection.
  </text>

  <!-- Tech badges -->
  <rect x="24" y="168" width="73" height="26" rx="13"
        fill="#172B45" stroke="#4285F4"/>
  <text x="60.5" y="186" text-anchor="middle"
        font-size="13" font-weight="700" fill="#8AB4F8">Python</text>

  <rect x="105" y="168" width="122" height="26" rx="13"
        fill="#30251B" stroke="#FBBC05"/>
  <text x="166" y="186" text-anchor="middle"
        font-size="13" font-weight="700" fill="#FBBC05">Scikit-learn</text>
</svg>
