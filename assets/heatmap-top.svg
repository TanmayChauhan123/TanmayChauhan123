<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 116" width="1200" height="116" role="img" aria-label="Contribution matrix header">
  <defs>
    <linearGradient id="google" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#EA4335"/>
      <stop offset="66%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4285F4" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;
    }
    .c {
      animation: p 2.6s ease-in-out infinite;
      opacity: .2;
    }
    @keyframes p {
      0%, 100% { opacity: .2; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="1200" height="116" fill="#0D1117"/>

  <!-- Corner accents -->
  <path d="M10 44V10H44M1156 10H1190V44"
        fill="none" stroke="url(#google)"
        stroke-width="4" stroke-linecap="round"/>

  <!-- Header -->
  <text x="40" y="56" font-size="28" font-weight="700"
        fill="#FFFFFF" letter-spacing="2">THE GRIND MATRIX</text>

  <text x="1160" y="54" text-anchor="end"
        font-size="22" font-weight="700" fill="#34A853">
    ● CURRENTLY GRINDING
    <animate attributeName="opacity" values="1;.2;1"
             dur="1.4s" repeatCount="indefinite"/>
  </text>

