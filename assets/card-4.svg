<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 208" width="480" height="208" role="img" aria-label="PrepForge project card">

<defs>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>

  <linearGradient id="google" x1="0" x2="1">
    <stop offset="0%" stop-color="#4285F4"/>
    <stop offset="35%" stop-color="#EA4335"/>
    <stop offset="65%" stop-color="#FBBC05"/>
    <stop offset="100%" stop-color="#34A853"/>
  </linearGradient>
</defs>

<style>
  text {
    font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular',
    Consolas, 'Courier New', monospace;
  }
</style>

<!-- Background -->
<rect width="480" height="208" fill="#0D1117"/>

<rect x="2" y="2" width="476" height="204" rx="14"
      fill="#111820" stroke="#30363D" stroke-width="2"/>

<!-- Animated border -->
<rect x="2" y="2" width="476" height="204" rx="14"
      fill="none" stroke="url(#google)" stroke-width="3"
      stroke-dasharray="150 1226">
  <animate attributeName="stroke-dashoffset"
           from="0" to="-1376" dur="7s"
           begin="1.2s" repeatCount="indefinite"/>
</rect>

<!-- Project icon -->
<rect x="22" y="20" width="56" height="56" rx="12"
      fill="#172B45" stroke="#4285F4" stroke-width="2"/>

<g transform="translate(26 24) scale(2)"
   fill="none" stroke="#4285F4" stroke-width="2"
   stroke-linecap="round" stroke-linejoin="round">
  <rect x="9" y="3" width="6" height="11" rx="3"/>
  <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/>
</g>

<!-- Project title -->
<text x="94" y="56" font-size="24"
      font-weight="700" fill="#FFFFFF">
  PrepForge
</text>

<!-- Project number -->
<text x="458" y="40" text-anchor="end"
      font-size="15" font-weight="700" fill="#4285F4">
  04
</text>

<!-- Description -->
<text x="24" y="104" font-size="14.5" fill="#E6EDF3">
  Interview preparation platform with
</text>
<text x="24" y="126" font-size="14.5" fill="#E6EDF3">
  authentication, interview sessions, saved
</text>
<text x="24" y="148" font-size="14.5" fill="#E6EDF3">
  answers, and planned local-AI feedback.
</text>

<!-- Technology badges -->
<rect x="24" y="168" width="81" height="26" rx="13"
      fill="#183126" stroke="#34A853" stroke-opacity=".8"/>
<text x="64.5" y="186" text-anchor="middle"
      font-size="13" font-weight="700" fill="#57C785">
  MongoDB
</text>

<rect x="113" y="168" width="81" height="26" rx="13"
      fill="#30251B" stroke="#FBBC05" stroke-opacity=".8"/>
<text x="153.5" y="186" text-anchor="middle"
      font-size="13" font-weight="700" fill="#FBBC05">
  Express
</text>

<rect x="202" y="168" width="65" height="26" rx="13"
      fill="#172B45" stroke="#4285F4" stroke-opacity=".8"/>
<text x="234.5" y="186" text-anchor="middle"
      font-size="13" font-weight="700" fill="#8AB4F8">
  React
</text>

<rect x="275" y="168" width="81" height="26" rx="13"
      fill="#30251B" stroke="#EA4335" stroke-opacity=".8"/>
<text x="315.5" y="186" text-anchor="middle"
      font-size="13" font-weight="700" fill="#F28B82">
  Node.js
</text>

</svg>
