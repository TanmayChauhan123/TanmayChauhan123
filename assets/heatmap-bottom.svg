<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Snake status bar">
  <defs>
    <linearGradient id="google" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#EA4335"/>
      <stop offset="66%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: 'Fira Code', 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Courier New', monospace;
    }
    .e {
      transform-box: fill-box;
      transform-origin: bottom;
      animation: q ease-in-out infinite alternate;
    }
    @keyframes q {
      from { transform: scaleY(.15); }
      to { transform: scaleY(1); }
    }
  </style>

  <rect width="1200" height="96" fill="#0D1117"/>

  <!-- Corner frame -->
  <path d="M10 50V86H44M1156 86H1190V50"
        fill="none" stroke="url(#google)"
        stroke-width="4" stroke-linecap="round"/>

  <!-- Status text -->
  <text x="40" y="44" font-size="22" fill="#E6EDF3">
    <tspan fill="#4285F4" font-weight="700">COMMIT.exe IN PROGRESS</tspan>
  </text>

  <!-- Animated track -->
  <line x1="60" y1="76" x2="1140" y2="76"
        stroke="url(#track)" stroke-opacity=".65" stroke-width="2"/>

  <circle r="6" cy="76" fill="#FBBC05">
    <animate attributeName="cx" from="60" to="1140"
             dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated signal bars -->
  <rect class="e" x="960" y="22" width="8" height="40" rx="2" fill="#4285F4" style="animation-duration:1.03s;animation-delay:0.14s"/>
  <rect class="e" x="973" y="22" width="8" height="40" rx="2" fill="#EA4335" style="animation-duration:0.82s;animation-delay:0.91s"/>
  <rect class="e" x="986" y="22" width="8" height="40" rx="2" fill="#FBBC05" style="animation-duration:0.73s;animation-delay:0.59s"/>
  <rect class="e" x="999" y="22" width="8" height="40" rx="2" fill="#34A853" style="animation-duration:1.31s;animation-delay:0.80s"/>
  <rect class="e" x="1012" y="22" width="8" height="40" rx="2" fill="#4285F4" style="animation-duration:1.40s;animation-delay:0.69s"/>
  <rect class="e" x="1025" y="22" width="8" height="40" rx="2" fill="#EA4335" style="animation-duration:1.26s;animation-delay:0.38s"/>
  <rect class="e" x="1038" y="22" width="8" height="40" rx="2" fill="#FBBC05" style="animation-duration:1.16s;animation-delay:0.71s"/>
  <rect class="e" x="1051" y="22" width="8" height="40" rx="2" fill="#34A853" style="animation-duration:1.37s;animation-delay:0.55s"/>
  <rect class="e" x="1064" y="22" width="8" height="40" rx="2" fill="#4285F4" style="animation-duration:1.08s;animation-delay:1.13s"/>
  <rect class="e" x="1077" y="22" width="8" height="40" rx="2" fill="#EA4335" style="animation-duration:0.75s;animation-delay:0.80s"/>
  <rect class="e" x="1090" y="22" width="8" height="40" rx="2" fill="#FBBC05" style="animation-duration:1.22s;animation-delay:0.84s"/>
  <rect class="e" x="1103" y="22" width="8" height="40" rx="2" fill="#34A853" style="animation-duration:1.36s;animation-delay:1.19s"/>
  <rect class="e" x="1116" y="22" width="8" height="40" rx="2" fill="#4285F4" style="animation-duration:1.01s;animation-delay:0.34s"/>
  <rect class="e" x="1129" y="22" width="8" height="40" rx="2" fill="#EA4335" style="animation-duration:0.72s;animation-delay:0.80s"/>
  <rect class="e" x="1142" y="22" width="8" height="40" rx="2" fill="#FBBC05" style="animation-duration:0.83s;animation-delay:0.55s"/>
  <rect class="e" x="1155" y="22" width="8" height="40" rx="2" fill="#34A853" style="animation-duration:0.75s;animation-delay:0.14s"/>
</svg>
